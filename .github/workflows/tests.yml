# Tests automatiques : lancés à chaque modification du code (pas des données).
# Ils vérifient la logique (fenêtre horaire, calculs, contrôle de cohérence…) sans appeler les API.
name: Tests

on:
  push:
    branches: [main]
    paths: ["agents/**", "checks/**", "web/**", "orchestrator.py", "tests/**", "config/**", "requirements.txt"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
